[project]
name = "blundertrace-backend"
version = "0.1.0"
description = "BlunderTrace API and analysis worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false   # plain app, not an installable package

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
