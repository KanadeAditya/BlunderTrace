[project]
name = "blundertrace-research"
version = "1.0.0"
description = "Pre-build retrieval feasibility research for BlunderTrace"
authors = [
    { name = "Aditya Kanade", email = "110182805+KanadeAditya@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "zstandard>=0.25.0",
]

[tool.uv]
package = false          # plain app (main.py), not an installable package
