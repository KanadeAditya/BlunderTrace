[project]
name = "blundertrace"
version = "0.1.0"
description = "AI chess coach: finds recurring mistakes across games and explains them with cited theory"
authors = [
    { name = "Aditya Kanade", email = "110182805+KanadeAditya@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "zstandard>=0.25.0",
]
